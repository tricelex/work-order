openapi: 3.1.0
info:
  title: Work Orders API
  version: 1.0.0
servers:
  - url: /api
paths:
  /work-orders:
    get:
      operationId: listWorkOrders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Status'
      responses:
        '200':
          description: Work orders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createWorkOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOrderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
  /work-orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getWorkOrder
      responses:
        '200':
          description: The work order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateWorkOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkOrderInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteWorkOrder
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Work order not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Priority:
      type: string
      enum: [Low, Medium, High]
    Status:
      type: string
      enum: [Open, In Progress, Done]
    WorkOrder:
      type: object
      required: [id, title, description, priority, status, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 2000
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/Status'
        updatedAt:
          type: string
          format: date-time
    CreateWorkOrderInput:
      type: object
      required: [title, priority]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 2000
          default: ''
        priority:
          $ref: '#/components/schemas/Priority'
    UpdateWorkOrderInput:
      type: object
      required: [title, description, priority, status]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 2000
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/Status'
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, INVALID_JSON, NOT_FOUND, INTERNAL_ERROR]
            message:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
